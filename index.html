html,body{margin:0;background:#F4EFE8;color:#2B2420;font-family:Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}

.list{display:flex;flex-direction:column;gap:14px}.list.tight{gap:8px}
.card{display:flex;gap:14px;padding:12px;border:1px solid #E2D8CB;border-radius:20px;background:#FFFCF8;text-align:left;width:100%}
.thumb{flex:0 0 96px;height:112px;border-radius:14px;display:flex;align-items:center;justify-content:center}

.ctitle{font-size:23px;line-height:1.15}

/* ======== TEMA MAISON: porcelana, esmalte negro, terracota y oro ======== */
:root{--bg:#F4EFE8;--card:#FFFCF7;--ink:#171412;--muted:#877B71;--clay:#A4573A;--gold:#B8975A;--line:#E5DCD0;--sand:#EDE5D9;--accent:#A4573A}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-weight:400}
body{background-image:radial-gradient(rgba(23,20,18,.035) 1px,transparent 1px);background-size:3px 3px}
h1,h2,h3,.ctitle,.ltitle,.at,.ptitle,.hero-t,.ttitle,#v3t,.gtext,.big,.anum,.pt{font-family:'Cormorant Garamond',Georgia,serif!important;font-weight:500!important;letter-spacing:-.005em;font-style:normal}
h1{font-size:44px;line-height:1;margin:0}h2{font-size:38px;line-height:1.05}h3{font-size:28px}
h1 em,h2 em{font-style:italic;color:var(--clay);font-weight:400}
.eyebrow{font-family:Inter,sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.eyebrow::before{content:'';width:16px;height:1px;background:var(--gold);flex:0 0 16px}
.eyebrow svg{width:14px;height:14px}
.muted{color:var(--muted)}.sm{font-size:14px;line-height:1.55}.xs{font-size:12px;line-height:1.45}
.lead{font-size:16px;line-height:1.6;color:#3B342F}
.pad{gap:26px;padding:22px 22px 32px}
section{display:flex;flex-direction:column;gap:10px}
/* marca */
.top{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 -6px}
.wm{display:flex;align-items:center;gap:10px}.wm .mark{flex:0 0 auto}
.wmt{display:flex;align-items:baseline;gap:8px;line-height:1}
.wmt i{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;font-size:25px}
.wmt b{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:18px;letter-spacing:.32em}
.hello{display:flex;flex-direction:column;gap:6px}
.home h1{font-size:50px}
/* superficies */
.card,.ref,.cell,.grow,.acc,.rcard,.layerctl,.step,.coll,.prow,.rowlink,.invite{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:none}
.card{border-radius:18px}.thumb,.tthumb,.lmosaic{border-radius:14px}
.thumb img,.tthumb img{object-fit:cover}
.ctitle{font-size:24px;line-height:1.05}
.ttitle{font-size:19px;line-height:1.1}
.ltitle{font-size:21px}
.tag{background:transparent!important;color:var(--muted)!important;border:1px solid var(--line);border-radius:999px;font-family:Inter,sans-serif;font-weight:600;font-size:9.5px;letter-spacing:.16em;padding:3px 9px}
/* botones */
.primary{background:var(--ink);color:#F7F2EA;border:0;border-radius:999px;font-family:Inter,sans-serif;font-weight:500;font-size:15px;letter-spacing:.02em;min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px}
.primary svg{color:var(--gold)}
.secondary{background:transparent;border:1px solid #CBBFB0;border-radius:999px;font-family:Inter,sans-serif;font-weight:500;font-size:14.5px;color:var(--ink);min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px}
.secondary.on{background:var(--ink);color:#F7F2EA;border-color:var(--ink)}
.projbtn.on{background:transparent;color:var(--clay);border-color:var(--clay)}
.chip{border-radius:999px;border:1px solid #D8CDBF;background:transparent;font-family:Inter,sans-serif;font-weight:500;font-size:13px;color:var(--ink);min-height:40px;padding:8px 15px}
.chip.on{background:var(--ink);color:#F7F2EA;border-color:var(--ink)}
.lbtn{border-radius:999px;border:1px solid #D8CDBF;background:transparent;font-weight:500;font-size:13.5px}
.link,.more{color:var(--clay);font-family:Inter,sans-serif;font-weight:500;font-size:13px;letter-spacing:.04em;text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(164,87,58,.35)}
.pill{border-radius:999px;font-family:Inter,sans-serif;font-weight:500;background:rgba(255,252,247,.92)}
.round{background:var(--card)}.round.bordered{border:1px solid var(--line)}
.b3d{background:var(--ink)!important;color:#F7F2EA}
.backlink{align-self:flex-start;display:flex;align-items:center;gap:4px;border:0;background:none;padding:0;min-height:36px;margin:-6px 0 -14px -4px;font-family:Inter,sans-serif;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.backlink svg{width:18px;height:18px}
/* buscador */
.sbox{border:1px solid #D8CDBF;border-radius:999px;background:var(--card);padding:5px 5px 5px 16px}
.sbox input{font-size:15px}
.sgo{border-radius:999px;background:var(--ink);font-weight:500;padding:0 16px}
/* proyecto en curso */
.proj{display:flex;flex-direction:column;gap:12px;padding:12px;border-radius:22px;background:var(--card);border:1px solid var(--line);position:relative}
.proj::after{content:'';position:absolute;inset:5px;border:1px solid rgba(184,151,90,.28);border-radius:18px;pointer-events:none}
.projhit{display:flex;gap:14px;align-items:center;border:0;background:none;padding:0;text-align:left;width:100%;position:relative;z-index:1}
.projart{flex:0 0 92px;height:108px;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.proj.big .projart{flex-basis:108px;height:124px}
.projart img{width:100%;height:100%;object-fit:cover}.projart svg{width:88%;height:88%}
.projb{display:flex;flex-direction:column;gap:6px;min-width:0}
.projb .eyebrow{color:var(--clay);margin:0}
.projbar{height:3px;background:var(--sand);border-radius:3px;overflow:hidden;margin-top:4px}
.projbar span{display:block;height:100%;background:var(--clay)}
.proj .primary{position:relative;z-index:1}
.invite{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:18px;border-style:dashed}
.prow{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 8px}
.prowhit{flex:1;display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;text-align:left;min-width:0}
.prowhit>span:last-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.pthumb{flex:0 0 52px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.pthumb img{width:100%;height:100%;object-fit:cover}
.pt{font-size:19px;line-height:1.1}
.mini{border:1px solid #CBBFB0;background:transparent;border-radius:999px;min-height:36px;padding:0 12px;font-size:12.5px;font-weight:500}
.mini.ghost{border:0;color:var(--muted);padding:0 8px}
/* claude en el inicio: sereno */
.aimini{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:22px;background:var(--sand);border:1px solid var(--line)}
.aimini .eyebrow{margin:0}
.aimini textarea,.aibox textarea{width:100%;border:0;border-bottom:1px solid #CBBFB0;border-radius:0;background:transparent;color:var(--ink);padding:6px 0 10px;font:italic 400 22px/1.3 'Cormorant Garamond',Georgia,serif;resize:none;outline:none}
.aimini textarea::placeholder,.aibox textarea::placeholder{color:#A0938A}
.aibox{background:var(--sand);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:20px}
.aibox .aih{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:500;line-height:1.15;margin:-2px 0 0}
.primary.light{background:var(--ink);color:#F7F2EA}
.secondary.dark{background:transparent;color:var(--ink);border-color:#CBBFB0}
.chip.dk{border-color:#D3C6B6;color:var(--ink);font-size:12.5px}
.gcard{background:var(--ink);color:#F7F2EA;border-radius:22px}
.gcard .gtext{color:#F7F2EA;font-style:italic!important}
/* explorar */
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.rooms button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:0;background:var(--card);padding:14px 14px 16px;min-height:96px}
.rooms .rn{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:15px;color:var(--gold);margin-bottom:6px}
.rooms b{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:22px;line-height:1}
.rooms span:last-child{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.tile .tag{display:none}
.grp{display:flex;flex-direction:column;gap:12px}
.grph{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}
.grph h3{font-size:26px;margin:0}
.grph span{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:18px;color:var(--gold)}
.more{align-self:flex-start;border:0;background:none;min-height:40px;padding:0}
.coll{display:flex;flex-direction:column;gap:12px;padding:12px;text-align:left;width:100%}
.collart{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:12px;overflow:hidden;height:110px}
.collart span{display:flex;align-items:center;justify-content:center;overflow:hidden}.collart img{width:100%;height:100%;object-fit:cover}
.collb{display:flex;flex-direction:column;gap:4px;padding:0 4px 4px}
.lcard .muted{letter-spacing:.06em}
/* mi atelier */
.rowlink{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;text-align:left}
.rowlink>span{display:flex;flex-direction:column;gap:2px}.rowlink b{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:21px}
.rowlink svg{transform:rotate(180deg);color:var(--muted)}
.pitem{border-radius:10px}.pitem.light{background:#fff;border:1px solid var(--line)}.pitem.light img{object-fit:contain}
.empty{border:1px dashed #D3C6B6;border-radius:18px}
/* estudio */
.segwrap{padding:20px 22px 0;display:flex;flex-direction:column;gap:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sand);border-radius:999px;padding:4px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:999px;min-height:40px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(23,20,18,.1)}
.segwrap+.pad{padding-top:16px}
.segwrap+.pad>.row:first-child{display:none}
.stagewrap{border-radius:18px}.spanel{background:var(--sand);border-radius:18px}
.tools button.on{background:var(--ink);border-color:var(--ink)}
/* ficha y pasos */
.ihero{border-radius:0 0 28px 28px;overflow:hidden}
.note{background:var(--sand);border-radius:16px;border-left:2px solid var(--gold)}
.note .eyebrow{color:var(--clay)}
.tip{background:var(--sand);border-radius:12px}
.big{color:var(--clay);font-style:italic}
.bar div,.srow.on .num,.srow.done .num{background:var(--clay)}
.anum{background:transparent;color:var(--gold);font-style:italic;border:1px solid rgba(184,151,90,.45)}
.feature{border-radius:22px;background:var(--card)!important;border:1px solid var(--line)}
.shortcuts button{background:var(--card);border:1px solid var(--line);border-radius:16px}
/* plantillas */
button.mode{border-color:var(--line);background:var(--card);border-radius:16px}
button.mode.on{border-color:var(--clay);background:#FBF3EC;box-shadow:inset 0 0 0 1px var(--clay)}
.plin{border-color:var(--line);background:var(--card);border-radius:12px}
.plchk input{accent-color:var(--clay)}
.proj .ctitle{color:var(--ink)}
.segwrap+.pad>.eyebrow:first-child,.segwrap+.pad>.eyebrow:first-child+h1{display:none}
.seg.two-v{grid-template-columns:1fr 1fr}.seg button{padding:0 6px;line-height:1.15}
.seg:has(button:nth-child(4)){grid-template-columns:repeat(4,1fr)}
.mdtop{display:flex;gap:14px;align-items:flex-start}.mdtop canvas{flex:0 0 120px;background:var(--sand);border-radius:14px}
.plgrid.one{grid-template-columns:1fr;flex:1;margin:0}
.mdrow{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.mdrow b{font-weight:600;font-size:14px}
.cutwrap canvas{width:100%;height:auto;border-radius:14px;display:block;background:#fff}
.tinput{width:100%;border:0;border-bottom:1px solid #CBBFB0;background:transparent;font:italic 400 21px 'Cormorant Garamond',Georgia,serif;padding:6px 0 8px;outline:none;color:var(--ink)}
.rphotos{display:flex;gap:10px;overflow-x:auto;margin:0 -22px 8px;padding:2px 22px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rph{flex:0 0 62%;aspect-ratio:4/5;border:0;padding:0;border-radius:16px;overflow:hidden;position:relative;background:var(--sand);scroll-snap-align:start}
.rph img{width:100%;height:100%;object-fit:cover;display:block}
.rph span{position:absolute;left:8px;bottom:8px;background:rgba(23,20,18,.72);color:#F7F2EA;font-size:11px;padding:3px 9px;border-radius:999px;letter-spacing:.04em}
.rph.skel{background:linear-gradient(90deg,var(--sand),#F6F0E7,var(--sand));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.lbox{position:fixed;inset:0;z-index:9000;background:rgba(17,14,13,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 14px 20px;gap:14px}
.lbox img{max-width:100%;max-height:72vh;border-radius:12px;object-fit:contain}
.lbx{position:absolute;top:12px;right:12px}
.lbcap{display:flex;flex-direction:column;align-items:center;gap:10px;color:#EDE5D9;font-size:13px;text-align:center}
.lbcap .lbtn{background:#F7F2EA;color:#171412}
.artgrid.two{grid-template-columns:1fr 1fr}.artbtn.big img{width:100%;height:auto;aspect-ratio:1}
.dprev{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;justify-content:center}.dprev img{max-width:100%;max-height:220px}
/* navegación */
nav{grid-template-columns:repeat(4,1fr)!important;border-top:1px solid var(--line)!important;background:rgba(250,247,242,.92)!important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
nav button{font-family:Inter,sans-serif;font-weight:500!important;font-size:10px!important;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)!important;position:relative}
nav button.on{color:var(--ink)!important}
nav button.on::before{content:'';position:absolute;top:3px;width:4px;height:4px;border-radius:50%;background:var(--clay)}
/* bienvenida (app instalada) */
.splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 38%,#2A2320,#110E0D 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#F3ECE1;transition:opacity .6s ease}
.splash.out{opacity:0}
.splash .mark{margin-bottom:22px;animation:rise 1s ease both}
.splash i{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;font-size:46px;line-height:1}
.splash b{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:30px;letter-spacing:.42em;margin-left:.42em}
.splash span{margin-top:16px;padding-top:12px;border-top:1px solid #C9A66B;font-size:10px;letter-spacing:.38em;color:#C9A66B}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* plantillas */
.plgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.plf{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted,#7a6a5e)}
.plin{display:flex;align-items:center;border:1px solid rgba(0,0,0,.14);border-radius:12px;background:#fff;padding:0 10px}
.plin input{border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:#2b211b;width:100%;padding:10px 0;min-width:0}
.plin em{font-style:normal;font-size:12px;opacity:.7}
.plchk{display:flex;gap:8px;align-items:center;font-size:14px;margin:10px 0}
.plchk input{width:20px;height:20px;accent-color:#A4502F}
.plprev{position:relative;background:repeating-conic-gradient(#f3ece4 0 25%,#fbf7f2 0 50%) 0 0/16px 16px;border-radius:16px;padding:12px;display:flex;justify-content:center;min-height:120px}
.plprev canvas{max-width:100%;box-shadow:0 1px 6px rgba(0,0,0,.12)}
button.mode{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:12px 14px;border:1px solid rgba(0,0,0,.1);border-radius:14px;background:#fff;font:inherit;color:inherit;width:100%}
button.mode b{font-size:15px}button.mode span{font-size:13px;opacity:.75}
button.mode.on{border-color:#A4502F;background:#fbf1ea;box-shadow:inset 0 0 0 1px #A4502F}
.calbox{display:flex;justify-content:center;padding:24px 0}
#calcard{border:2px solid #A4502F;border-radius:12px;background:#fbf1ea}
#calr{width:100%}
</style>
</head>

  for (var i = 0; i < p.length; i += 4) { var a = Math.min(1, Math.max(0, (Math.hypot(p[i] - b[0], p[i + 1] - b[1], p[i + 2] - b[2]) / full - .25) / .6)); var sa = p[i + 3] / 255; p[i] = p[i + 1] = p[i + 2] = 17; p[i + 3] = Math.round(a * sa * 255); }
